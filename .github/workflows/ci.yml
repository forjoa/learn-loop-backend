name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/learn_loop_db
      SIGNATURE: ci_placeholder_signature
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Boot smoke test
        run: |
          npm run start &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if curl -s -o /dev/null http://localhost:8000/; then
              echo "Server responded"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Server did not respond in time"
          kill $SERVER_PID
          exit 1
